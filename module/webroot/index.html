<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Detach</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="appbar">
      <svg class="logo" viewBox="0 0 42 42" aria-hidden="true">
        <g class="ring">
          <circle cx="21" cy="21" r="19" fill="none" stroke="#c77dff" stroke-width="2" stroke-dasharray="12 5 3 5" stroke-linecap="round"/>
        </g>
        <rect x="9" y="15" width="17" height="12" rx="4" fill="#c77dff"/>
        <rect x="25.5" y="17" width="6" height="2.6" rx="1.2" fill="#c77dff"/>
        <rect x="25.5" y="22.4" width="6" height="2.6" rx="1.2" fill="#c77dff"/>
        <polygon points="14.5,18 14.5,24 19.6,21" fill="#22062f"/>
      </svg>
      <div class="title">
        <h1>Play Detach</h1>
        <div class="sub" id="version">Zygisk module</div>
      </div>
      <a class="icon-btn" href="help.html" aria-label="Help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/>
        </svg>
      </a>
    </div>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="search" type="search" placeholder="Search apps or packages" autocomplete="off" spellcheck="false" aria-label="Search apps">
      <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </label>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="user" aria-selected="true">User apps <span class="n" id="n-user">0</span></button>
      <button class="tab" role="tab" data-tab="detached" aria-selected="false">Detached <span class="n" id="n-detached">0</span></button>
      <button class="tab" role="tab" data-tab="system" aria-selected="false">System apps <span class="n" id="n-system">0</span></button>
    </div>

    <div class="status" id="status" data-state="idle">
      <span class="dot"></span><span class="text" id="status-text">Loading...</span>
    </div>
  </header>

  <main>
    <div class="list" id="list" aria-live="polite">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div>
    </div>
    <div class="list-foot" id="foot" hidden>
      <button class="text-btn" id="backup" type="button">Back up list</button>
      <button class="text-btn" id="restore" type="button">Restore backup</button>
      <button class="text-btn" id="reattach-all" type="button">Re-attach all</button>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <div class="sheet-backdrop" id="picker" hidden>
    <div class="sheet picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <h2 id="picker-title">Save backup</h2>
      <div class="crumbs" id="picker-path"></div>
      <div class="picker-list" id="picker-list"></div>
      <div class="picker-save" id="picker-save">
        <label for="picker-name">File name</label>
        <input id="picker-name" type="text" spellcheck="false" autocomplete="off" autocapitalize="off">
        <div class="picker-warn" id="picker-warn" hidden>A file with this name is already here and will be replaced.</div>
      </div>
      <div class="actions">
        <button class="btn ghost" id="picker-cancel" type="button">Cancel</button>
        <button class="btn primary" id="picker-ok" type="button">Save here</button>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="confirm" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Re-attach all apps?</h2>
      <p id="confirm-text">The Play Store will see every detached app again and offer updates for them.</p>
      <div class="actions">
        <button class="btn ghost" id="confirm-no" type="button">Cancel</button>
        <button class="btn primary" id="confirm-yes" type="button">Re-attach all</button>
      </div>
    </div>
  </div>
</body>
</html>

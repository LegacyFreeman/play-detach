name: Build Play Detach

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip wget

      - name: Download Android NDK r29
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r29" >> $GITHUB_ENV

      - name: Build module
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Show output files
        run: |
          find out -type f

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: play-detach
          path: out/*.zip
          if-no-files-found: error

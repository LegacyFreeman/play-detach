# .github/workflows/release.yml

name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip wget

      - name: Download Android NDK r29
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q android-ndk-r29-linux.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r29" >> $GITHUB_ENV

      - name: Build module
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Parse module metadata
        id: metadata
        run: |
          VERSION=$(sed -n 's/^version=//p' module/module.prop)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          ZIPFILE=$(find out -name '*.zip' | head -n 1)

          echo "zipfile=$ZIPFILE" >> $GITHUB_OUTPUT

      - name: Show build results
        run: |
          echo "Version: ${{ steps.metadata.outputs.version }}"
          echo "Tag: ${{ steps.metadata.outputs.tag }}"
          echo "ZIP: ${{ steps.metadata.outputs.zipfile }}"
          ls -lah out/

      - name: Create or Update Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f ${{ steps.metadata.outputs.tag }}
          git push origin ${{ steps.metadata.outputs.tag }} --force

      - name: Create GitHub Release

name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "v1.0.3"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build module
        run: ./build.sh

      - name: Find zip
        run: |
          find . -type f -name "*.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            release/*.zip
            out/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
